<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://fptnqolkmagfyjpedbix.supabase.co https://via.placeholder.com; connect-src 'self' https://fptnqolkmagfyjpedbix.supabase.co wss://fptnqolkmagfyjpedbix.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; media-src 'self' blob: https://fptnqolkmagfyjpedbix.supabase.co; frame-src 'self' https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8fafc">
  <title>Admin Login — VLSI | SIET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous"/>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:1rem; background:#f8fafc; color:#1a202c; font-family:Inter,sans-serif; }
    .admin-auth-card { width:min(100%,440px); background:#fff; border:1px solid #e2e8f0; border-radius:1.5rem; padding:clamp(1.5rem,5vw,2.5rem); box-shadow:0 24px 60px -36px rgba(22,82,196,.32); }
    .admin-auth-icon { width:3.5rem; height:3.5rem; margin:0 auto 1rem; border-radius:1rem; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,#1652c4,#2fe6dd); }
    .admin-auth-field { width:100%; box-sizing:border-box; padding:.8rem .9rem; border:1px solid #cbd5e1; border-radius:.75rem; color:#1a202c; background:#fff; font:inherit; font-size:.92rem; }
    .admin-auth-field:focus { outline:3px solid rgba(22,82,196,.24); border-color:#1652c4; }
    .admin-auth-button { width:100%; display:flex; justify-content:center; align-items:center; gap:.55rem; min-height:2.9rem; border:0; border-radius:.75rem; background:#1652c4; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    .admin-auth-button:hover { background:#1240a0; }
    .admin-auth-button:disabled { opacity:.65; cursor:wait; }
    .admin-auth-message { min-height:1.3rem; margin:.75rem 0; color:#b91c1c; font-size:.85rem; }
    .admin-auth-link { color:#1652c4; font-size:.82rem; text-decoration:underline; text-underline-offset:3px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="admin-auth-card">
    <div class="admin-auth-icon" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></div>
    <h1 style="margin:0;text-align:center;color:#1a202c;font-size:1.55rem">Admin Login</h1>
    <p style="margin:.45rem 0 1.5rem;text-align:center;color:#64748b;font-size:.9rem">Department of VLSI Design and Technology</p>

    <form id="admin-login-form" novalidate>
      <label for="admin-email" style="display:block;margin:0 0 .4rem;font-size:.82rem;font-weight:600">Email</label>
      <input class="admin-auth-field" id="admin-email" type="email" autocomplete="username" inputmode="email" required value="hodvlsi@siet.ac.in">
      <label for="admin-password" style="display:block;margin:1rem 0 .4rem;font-size:.82rem;font-weight:600">Password</label>
      <div style="position:relative">
        <input class="admin-auth-field" id="admin-password" type="password" autocomplete="current-password" required style="padding-right:3.3rem">
        <button id="toggle-admin-password" type="button" aria-label="Show password" aria-pressed="false" style="position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border:0;background:transparent;color:#64748b;cursor:pointer"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
      </div>
      <p id="admin-login-message" class="admin-auth-message" role="alert" aria-live="assertive"></p>
      <button id="admin-login-submit" class="admin-auth-button" type="submit"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>Sign in</span></button>
      <div style="display:flex;justify-content:flex-end;margin-top:.85rem"><button id="forgot-password" type="button" class="admin-auth-link" style="border:0;background:transparent;cursor:pointer">Forgot password?</button></div>
    </form>

    <form id="admin-recovery-form" hidden>
      <label for="new-password" style="display:block;margin:0 0 .4rem;font-size:.82rem;font-weight:600">New password</label>
      <input class="admin-auth-field" id="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm-password" style="display:block;margin:1rem 0 .4rem;font-size:.82rem;font-weight:600">Confirm new password</label>
      <input class="admin-auth-field" id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
      <p id="admin-recovery-message" class="admin-auth-message" role="status" aria-live="polite"></p>
      <button id="admin-recovery-submit" class="admin-auth-button" type="submit"><i class="fa-solid fa-key" aria-hidden="true"></i><span>Update password</span></button>
    </form>

    <p id="admin-auth-info" role="status" aria-live="polite" style="min-height:1.3rem;margin:.65rem 0 0;color:#475569;font-size:.82rem"></p>
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e2e8f0;text-align:center"><a href="../index.html" class="admin-auth-link">← Back to website</a></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
