<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Offline - SIET VLSI Department"/>
  <title>Offline — VLSI | SIET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="assets/images/department_logo.png"/>
  <script>        tailwind.config = {
      theme: {                                                
        extend: {
          colors: {
            'ink-navy':   '#2D3748',
            'ink-light':  '#4A5568',
            'circuit-blue':'#5A67D8',
            'circuit-dark':'#434190',
            'signal-cyan': '#00B5D8',
            mist:          '#EDF2F7',
            accent:        '#5A67D8',
            surface:       '#F7FAFC',
            'surface-2':   '#E2E8F0',
            default:       '#A0AEC0',
          },
          fontFamily: {
            display: ['"Inter"','sans-serif'],
            body:    ['"Inter"','sans-serif'],
            mono:    ['"Inter"','sans-serif'],
          },
          borderRadius: { 'lg':'16px', 'xl':'24px', '2xl':'32px', '3xl':'40px', '4xl':'48px', '5xl':'56px', 'full':'9999px' },
          boxShadow: {
            'sm': '4px 4px 10px rgba(166,180,200,0.5), -4px -4px 10px rgba(255,255,255,0.9), inset 1px 1px 2px rgba(255,255,255,0.8), inset -1px -1px 2px rgba(166,180,200,0.2)',
            DEFAULT: '8px 8px 16px rgba(166,180,200,0.5), -8px -8px 16px rgba(255,255,255,0.9), inset 2px 2px 4px rgba(255,255,255,0.8), inset -2px -2px 4px rgba(166,180,200,0.2)',
            'md': '10px 10px 20px rgba(166,180,200,0.5), -10px -10px 20px rgba(255,255,255,0.9), inset 2px 2px 4px rgba(255,255,255,0.8), inset -2px -2px 4px rgba(166,180,200,0.2)',
            'lg': '12px 12px 24px rgba(166,180,200,0.5), -12px -12px 24px rgba(255,255,255,0.9), inset 3px 3px 6px rgba(255,255,255,0.8), inset -3px -3px 6px rgba(166,180,200,0.2)',
            'xl': '20px 20px 40px rgba(166,180,200,0.6), -20px -20px 40px rgba(255,255,255,1), inset 4px 4px 8px rgba(255,255,255,0.9), inset -4px -4px 8px rgba(166,180,200,0.3)',
          }
        }
      }
    }
  </script>
  <style>
    :root { --clr-bg:#fff; --clr-surface:#fff; --clr-text-primary:#0b1b33; --clr-text-secondary:#5b6478; --clr-accent:#1652c4; --clr-cyan:#2fe6dd; }
    body { font-family:'IBM Plex Sans',sans-serif; background:var(--clr-bg); color:var(--clr-text-primary); }
  </style>
</head>
<body class="font-body antialiased min-h-screen flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <div class="w-24 h-24 mx-auto mb-6 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,var(--clr-accent),var(--clr-cyan))">
      <i class="fa-solid fa-wifi-slash text-4xl text-white"></i>
    </div>
    <h1 class="font-display text-3xl font-bold mb-3" style="color:var(--clr-text-primary)">You're Offline</h1>
    <p class="mb-6" style="color:var(--clr-text-secondary)">No internet connection detected. Some features may be unavailable.</p>
    <div class="space-y-3">
      <button onclick="window.location.reload()" class="btn-primary w-full sm:w-auto px-6 py-3">
        <i class="fa-solid fa-rotate mr-2"></i>Try Again
      </button>
      <a href="index.html" class="btn-secondary w-full sm:w-auto px-6 py-3 inline-block" style="background:var(--clr-surface);color:var(--clr-text-primary);border:1px solid var(--clr-border);border-radius:0.75rem;font-weight:500;text-decoration:none">
        <i class="fa-solid fa-house mr-2"></i>Go Home
      </a>
    </div>
    <p class="mt-8 text-sm" style="color:var(--clr-text-muted)">The app works offline for previously visited pages.</p>
  </div>
  <script>
    // Offline script
  </script>
</body>
</html>
